name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + test)
    # Self-hosted for anything that already has write access (pushes to main,
    # PRs from branches in this repo). PRs from forks are untrusted code and
    # must not run on our own hardware, so they fall back to a GitHub runner.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "linux", "X64"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # No solution filename here so the file survives the template rename
      # untouched — GITHUB_TOKEN cannot push changes to workflow files. dotnet
      # resolves the single .sln in the working directory.
      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

  frontend:
    name: Frontend (build + test)
    # Self-hosted for anything that already has write access (pushes to main,
    # PRs from branches in this repo). PRs from forks are untrusted code and
    # must not run on our own hardware, so they fall back to a GitHub runner.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "linux", "X64"]') || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: ClientApp
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      # npm ci (not npm install) so the committed lockfile is the source of
      # truth and drifts fail loudly. The lockfile must be generated in a clean
      # tree so npm records every platform's optional native binary — an
      # incremental install records only the host's, which breaks Linux CI.
      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build -- --configuration production

      - name: Test
        run: npm test -- --no-watch
