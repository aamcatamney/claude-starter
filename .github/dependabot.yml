version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dotnet:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /ClientApp
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # typescript, vitest and @ngrx/* are peer-coupled to @angular/*, so they
    # must move in the same PR — split across groups, neither PR can resolve
    # on its own. See docs/adr/0002 and 0006.
    groups:
      angular:
        patterns:
          ['@angular/*', '@angular-devkit/*', '@ngrx/*', 'typescript', 'vitest', 'zone.js']
      other:
        patterns: ['*']
        exclude-patterns:
          ['@angular/*', '@angular-devkit/*', '@ngrx/*', 'typescript', 'vitest', 'zone.js']
    # A TypeScript major is only ever allowed by an Angular major's
    # @angular/build peer range, so it is never a standalone bot bump.
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  # Screenshot tooling keeps its own manifest so a browser download stays out
  # of the client install; without an entry here Playwright would never be
  # updated.
  - package-ecosystem: npm
    directory: /scripts/screenshots
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /tests/e2e
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
